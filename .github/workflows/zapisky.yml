name: Zápisky

# Jednou týdně napíše nový zápis do rubriky a pushne ho. Netlify nasadí sám.
# Ověřuje se secretem ANTHROPIC_API_KEY (účtuje se podle spotřeby).
# Na předplatné místo API se přejde tak, že se řádek anthropic_api_key
# vymění za: claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
# Vypnout: Actions → Zápisky → ⋯ → Disable workflow.
# O čem a jak se píše, je v ZAPISKY.md — ne tady.

on:
  schedule:
    - cron: "0 4 * * 0"      # neděle 4:00 UTC
  workflow_dispatch:          # a kdykoli ručně

concurrency:
  group: zapisky
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  napsat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Napsat zápis
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Dočasně: bez tohohle akce skutečnou hlášku od API schová a v logu
          # zůstane jen "is_error: true". Až bude běh procházet, řádek smazat —
          # repozitář je veřejný a logy taky.
          show_full_output: true
          prompt: |
            Napiš nový zápis do rubriky Zápisky na téhle stránce.

            Přečti si ZAPISKY.md v kořeni repozitáře a řiď se jím do písmene. Je
            tam okruh rubriky, závazná pravidla i postup. Ten soubor je zadání a
            má přednost před tímhle textem.

            Tři věci, na kterých to nejčastěji ztroskotá:

            - Anonymita. Ze zápisu nesmí jít poznat, kdo web provozuje ani na čem
              dělá. Při pochybnosti téma nepoužij. Tohle je tvrdší než potřeba mít
              co vydat.
            - Nevymýšlet si. Žádná čísla, citace ani události bez ověření. Co je
              z webu, má odkaz.
            - Prázdný týden je v pořádku. Když není o čem psát tak, aby to stálo
              za čtení, nepiš nic, neměň žádný soubor a řekni proč. Vata je horší
              než mezera.

            Až budeš hotov, spusť `python3 tools/zkontroluj.py` a oprav všechno,
            co vypíše. Necommituj a nepushuj — to udělá workflow za tebe.
          claude_args: |
            --model claude-opus-5
            --max-turns 60
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash"

      - name: Zkontrolovat
        run: python3 tools/zkontroluj.py

      - name: Commit a push
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Beze změn — tenhle týden se nepsalo. Konec bez commitu."
            exit 0
          fi
          git config user.name  "Zápisky"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Zápisky: nový zápis"
          git push
